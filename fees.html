<!-- Google Fonts & html2pdf.js CDN (পিডিএফ ও ফন্ট অপ্টিমাইজেশন) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    #fees-container, .bangla-font {
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Kalpurush', sans-serif !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
    }
    .font-en {
        font-family: 'Inter', sans-serif !important;
    }
    .font-mono-receipt {
        font-family: 'JetBrains Mono', monospace !important;
    }
    .custom-scroll::-webkit-scrollbar {
        width: 4px;
        height: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 4px;
    }
</style>

<div id="fees-container" class="grid grid-cols-1 lg:grid-cols-3 gap-6 transition-all duration-300 bangla-font pb-12">

    <!-- বামে: বেতন আদায় ফরম -->
    <div class="lg:col-span-1 bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-gray-150 h-fit relative">
        <h3 id="fee-form-title" class="text-lg font-bold text-gray-800 mb-5 flex items-center gap-2 border-b pb-3">
            <i class="fa-solid fa-money-bill-wave text-emerald-600 text-xl"></i> নতুন বেতন কালেকশন
        </h3>

        <form id="fees-form" class="space-y-3.5 text-xs">
            <input type="hidden" id="editing-receipt-id" value="">
            <input type="hidden" id="fee-student-id" required>

            <!-- খোঁজার সুবিধাসহ তালিবে ইলম সিলেক্টর (Autocomplete Search) -->
            <div class="relative">
                <label class="block font-bold text-gray-700 mb-1">তালিবে ইলম খুঁজুন *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="student-search-input" oninput="window.searchStudentsForFee()" placeholder="নাম, রোল, আইডি বা মোবাইল নম্বর..."
                           class="w-full pl-9 pr-3 py-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 focus:outline-none font-bold bg-white">
                </div>
                <!-- ড্রপডাউন রেজাল্ট লিস্ট -->
                <div id="student-search-results" class="absolute left-0 right-0 mt-1 bg-white border border-emerald-200 rounded-xl shadow-xl z-20 max-h-48 overflow-y-auto hidden divide-y divide-gray-100 custom-scroll"></div>
            </div>

            <!-- তালিবে ইলমের ডাইনামিক কুইক প্রোফাইল কার্ড -->
            <div id="student-quick-info" class="hidden animate-fadeIn"></div>

            <!-- সেশন বছর ও বেতনের মাস -->
            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">শিক্ষাবর্ষ (Session) *</label>
                    <select id="fee-session-year" required class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:border-emerald-500 font-bold font-en bg-white cursor-pointer">
                        <!-- ডাইনামিক সেশন লোড হবে -->
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">বেতনের মাস *</label>
                    <select id="fee-month" onchange="window.onFeeMonthChange()" required
                            class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:border-emerald-500 bg-white font-bold text-gray-700 cursor-pointer">
                        <option value="">মাস নির্বাচন করুন</option>
                        <option value="জানুয়ারি">জানুয়ারি</option>
                        <option value="ফেব্রুয়ারি">ফেব্রুয়ারি</option>
                        <option value="মার্চ">মার্চ</option>
                        <option value="এপ্রিল">এপ্রিল</option>
                        <option value="মে">মে</option>
                        <option value="জুন">জুন</option>
                        <option value="জুলাই">জুলাই</option>
                        <option value="আগস্ট">আগস্ট</option>
                        <option value="সেপ্টেম্বর">সেপ্টেম্বর</option>
                        <option value="অক্টোবর">অক্টোবর</option>
                        <option value="নভেম্বর">নভেম্বর</option>
                        <option value="ডিসেম্বর">ডিসেম্বর</option>
                    </select>

            </div>

            <!-- পরিমাণ, জরিমানা ও ছাড় -->

                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">মাসিক ফি (৳) *</label>
                    <input type="text" id="fee-amount" required placeholder="০" min="0" 
                           oninput="this.value = window.convertToEnglishDigits(this.value); window.calculateTotal();"
                           class="w-full px-2.5 py-2 rounded-xl border border-gray-300 focus:border-emerald-500 font-bold font-en bg-gray-50 text-emerald-950">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">জরিমানা (+)</label>
                    <input type="text" id="fee-fine" placeholder="০" min="0" value="0" 
                           oninput="this.value = window.convertToEnglishDigits(this.value); window.calculateTotal();"
                           class="w-full px-2.5 py-2 rounded-xl border border-gray-300 focus:border-emerald-500 font-bold font-en bg-white text-rose-700">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-600 mb-1">বিশেষ ছাড় (-)</label>
                    <input type="text" id="fee-discount" placeholder="০" min="0" value="0"

            <!-- বিগত বকেয়া (অটো লোড লেজার ব্যালেন্স) -->

                    <span id="prev-due-hint" class="text-[9.5px] text-gray-400 font-bold">লেজার হতে সংগৃহীত</span>

                       oninput="this.value = window.convertToEnglishDigits(this.value); window.calculateTotal();"

            </div>

            <!-- মোট আদায়যোগ্য ও গৃহীত টাকা বক্স -->

                    </div>
                    <div class="flex flex-col justify-end text-right">

                        <strong class="text-xs font-bold text-rose-800 font-en">৳ <span id="fee-remaining-due">0</span></strong>
                    </div>

            <!-- মাধ্যম ও প্রদানের তারিখ -->
            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label class="block font-bold text-gray-700 mb-1">পেমেন্ট মাধ্যম *</label>
                    <select id="fee-method" required
                            class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:border-emerald-500 bg-white font-bold text-gray-700 cursor-pointer">
                        <option value="ক্যাশ">ক্যাশ (নগদ)</option>
                        <option value="বিকাশ">বিকাশ</option>
                        <option value="নগদ">নগদ (অ্যাপ)</option>
                        <option value="রকেট">রকেট</option>
                        <option value="ব্যাংক">ব্যাংক</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-gray-700 mb-1">প্রদানের তারিখ *</label>
                    <input type="date" id="fee-date" required
                           class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:border-emerald-500 font-bold bg-white cursor-pointer">
                </div>
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">অতিরিক্ত নোট / মন্তব্য (ঐচ্ছিক)</label>
                <input type="text" id="fee-note" placeholder="যেমন: ট্রানজেকশন নম্বর বা বিবরণ..."
                       class="w-full px-3.5 py-2 rounded-xl border border-gray-300 focus:border-emerald-500 font-bold bg-white">
            </div>

            <button type="submit" id="fee-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 rounded-xl transition duration-200 flex items-center justify-center gap-2 text-xs shadow-md cursor-pointer">
                <i class="fa-solid fa-circle-check"></i> পেমেন্ট নিশ্চিত করুন
            </button>

            <button type="button" id="cancel-fee-edit-btn" onclick="window.cancelFeeEdit()" class="hidden w-full bg-gray-150 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl transition text-xs border border-gray-300 cursor-pointer">
                সংশোধন বাতিল করুন
            </button>
        </form>
    </div>

    <!-- ডানে: সাম্প্রতিক বেতন আদায়ের তালিকা -->
    <div id="fees-list-container" class="lg:col-span-2 bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-gray-150 flex flex-col">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3 mb-4">
            <h3 class="text-base font-bold text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-receipt text-emerald-600 text-xl"></i> সাম্প্রতিক বেতন আদায়ের তালিকা
            </h3>
            
            <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                <input type="file" id="import-excel-file" accept=".xlsx, .xls" class="hidden" onchange="window.importFromExcel(event)">
                
                <button type="button" onclick="document.getElementById('import-excel-file').click()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                    <i class="fa-solid fa-file-import text-blue-600"></i> Excel ইমপোর্ট
                </button>
                
                <button type="button" onclick="window.exportToExcel()" class="bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                    <i class="fa-solid fa-file-export text-amber-600"></i> Excel এক্সপোর্ট
                </button>

                <button type="button" onclick="window.downloadFeesReportPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md cursor-pointer">
                    <i class="fa-solid fa-file-pdf text-sm"></i> রিপোর্ট পিডিএফ (A4)
                </button>
            </div>
        </div>

        <!-- ফিল্টারসমূহ -->
        <div class="mb-4 flex flex-col sm:flex-row gap-2.5">
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="search-fee" oninput="window.filterFees()" placeholder="রসিদ নং, ছাত্রের নাম বা আইডি..."
                       class="w-full pl-9 pr-4 py-2 rounded-xl border border-gray-300 focus:border-emerald-500 text-xs font-bold bg-white">
            </div>
            <div class="w-full sm:w-36">
                <select id="filter-fee-session" onchange="window.filterFees()" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs bg-white font-bold font-en cursor-pointer">
                    <!-- ডাইনামিক সেশন লোড হবে -->
                </select>
            </div>
            <div class="w-full sm:w-36">
                <select id="filter-fee-month" onchange="window.filterFees()" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs bg-white font-bold text-gray-700 cursor-pointer">
                    <option value="">সকল মাস</option>
                    <option value="জানুয়ারি">জানুয়ারি</option>
                    <option value="ফেব্রুয়ারি">ফেব্রুয়ারি</option>
                    <option value="মার্চ">মার্চ</option>
                    <option value="এপ্রিল">এপ্রিল</option>
                    <option value="মে">মে</option>
                    <option value="জুন">জুন</option>
                    <option value="জুলাই">জুলাই</option>
                    <option value="আগস্ট">আগস্ট</option>
                    <option value="সেপ্টেম্বর">সেপ্টেম্বর</option>
                    <option value="অক্টোবর">অক্টোবর</option>
                    <option value="নভেম্বর">নভেম্বর</option>

        <!-- ডেক্সটপ টেবিল ভিউ -->
        <div class="hidden md:block overflow-x-auto flex-1 rounded-xl border border-gray-150 max-h-[520px] overflow-y-auto custom-scroll">
            <table class="min-w-full divide-y divide-gray-100 text-xs">
                <thead class="bg-gray-50 font-bold sticky top-0 z-10 text-gray-500 border-b">

                    <th class="px-3 py-3 text-left">রসিদ ও তারিখ</th>

<!-- হিডেন কনটেইনার: A4 কালেকশন রিপোর্ট পিডিএফ জেনারেট করার জন্য -->
<div id="hidden-report-pdf-area" class="hidden"></div>

<script>
(function() {
    let allActiveStudents = [];
    let activePrintedFee = null; 
    let filteredFeesArray = [];
    let madrasahConfig = {};
    let feeGroupsList = [];

    async function fetchMadrasahConfig() {
        try {
            let config = await db.settings.get('madrasah_config_block');
            if (!config) {
                const allSettings = await db.settings.toArray();
                if (allSettings && allSettings.length > 0) config = allSettings[0];
            }
            madrasahConfig = config || {};
        } catch(e) {
            madrasahConfig = {};
        }
        return madrasahConfig;
    }

    window.initFees = async function() {
        document.getElementById('editing-receipt-id').value = "";

        const dateInput = document.getElementById('fee-date');
        if (dateInput) {
            dateInput.value = window.getLocalDateString();
        }

        const config = await fetchMadrasahConfig();
        feeGroupsList = config.fee_groups ? JSON.parse(config.fee_groups) : [];

        await loadDynamicFeeSessions(config.current_session);
        await loadActiveStudents();
        await window.renderFeesList();

        if (window.preselectedStudentId) {
            const student = allActiveStudents.find(s => s.id === window.preselectedStudentId);
            if (student) {
                window.selectStudentForFee(student.id, student.name, student.class, student.roll);
            }
            window.preselectedStudentId = null;
        }

        document.addEventListener('click', function(e) {
            const list = document.getElementById('student-search-results');
            const input = document.getElementById('student-search-input');
            if (list && e.target !== input && !list.contains(e.target)) {
                list.classList.add('hidden');
            }
        });

        const form = document.getElementById('fees-form');
        if (form) {
            form.onsubmit = async (e) => {
                e.preventDefault();

                const studentId = document.getElementById('fee-student-id').value;
                const sessionYearVal = document.getElementById('fee-session-year').value;
                const amount = parseFloat(window.convertToEnglishDigits(document.getElementById('fee-amount').value)) || 0;
                const fine = parseFloat(window.convertToEnglishDigits(document.getElementById('fee-fine').value)) || 0;
                const discount = parseFloat(window.convertToEnglishDigits(document.getElementById('fee-discount').value)) || 0;
                const previousDue = parseFloat(window.convertToEnglishDigits(document.getElementById('fee-previous-due').value)) || 0;
                const month = document.getElementById('fee-month').value;
                const method = document.getElementById('fee-method').value;
                const paymentDate = document.getElementById('fee-date').value;
                const note = document.getElementById('fee-note').value.trim();
                const editReceiptId = document.getElementById('editing-receipt-id').value;

                // মোট প্রদেয় পাওনা
                const totalPayable = Math.max(0, amount + fine + previousDue - discount);
                
                // আদায়কৃত টাকা (গৃহীত)
                const paidInputVal = document.getElementById('fee-paid-amount').value;
                const actualPaid = parseFloat(window.convertToEnglishDigits(paidInputVal)) || 0;

                // অবশিষ্ট বকেয়া
                const remainingDue = Math.max(0, totalPayable - actualPaid);

                if (!studentId || amount < 0 || !month || !paymentDate || !method) {
                    showToast("সকল প্রয়োজনীয় ঘরগুলো সঠিকভাবে পূরণ করুন!", "error");

                }

                const student = allActiveStudents.find(s => s.id === studentId);
                const studentName = student ? student.name : "অজানা তালিবে ইলম";
                const studentClass = student ? student.class : "";
                const studentRoll = student ? student.roll : "";
                const studentPhone = student ? (student.whatsapp_number || student.parent_phone) : "";

                const user = window.currentUser || JSON.parse(sessionStorage.getItem('currentUser'));
                const curUser = user ? user.username : "system";

                try {
                    let receiptIdToPrint = editReceiptId;
                    const feeObj = {
                        student_id: studentId,
                        student_name: studentName,
                        student_class: studentClass,
                        student_roll: studentRoll,
                        parent_phone: studentPhone,
                        session_year: sessionYearVal,
                        amount: amount, // মূল নির্ধারিত ফি
                        fine: fine,
                        discount: discount,
                        previous_due: previousDue, // বিগত বকেয়া
                        previous_due_paid: previousDue,
                        total_payable: totalPayable,
                        total: actualPaid, // গৃহীত টাকা
                        paid_amount: actualPaid,
                        remaining_due: remainingDue, // অবশিষ্ট বকেয়া
                        month: month,
                        method: method,
                        payment_date: paymentDate,
                        note: note,
                        created_by: curUser,
                        updated_by: curUser,
                        is_synced: 0
                    };

                    if (editReceiptId) {
                        const existing = await db.fees.get(editReceiptId);
                        feeObj.receipt_id = editReceiptId;
                        feeObj.created_by = existing ? existing.created_by : curUser;
                        feeObj.is_deleted = existing ? existing.is_deleted : 0;

                        await db.fees.update(editReceiptId, feeObj);
                        showToast("বেতন আদায়ের তথ্য সংশোধন করা হয়েছে।", "success");
                        window.cancelFeeEdit();
                    } else {
                        const receiptId = 'R-' + Date.now();
                        receiptIdToPrint = receiptId;
                        feeObj.receipt_id = receiptId;
                        feeObj.is_deleted = 0;

                        await db.fees.add(feeObj);

                        // ছাত্রের বর্তমান ওপেনিং বকেয়া সামঞ্জস্য করা
                        if (student) {
                            await db.students.update(studentId, { previous_due: remainingDue, is_synced: 0 });
                        }

                        showToast("বেতন কালেকশন সফলভাবে সম্পন্ন হয়েছে।", "success");
                        form.reset();
                        document.getElementById('student-quick-info').classList.add('hidden');
                        document.getElementById('fee-total').textContent = "0";
                        document.getElementById('fee-remaining-due').textContent = "0";
                        document.getElementById('fee-paid-amount').dataset.manual = "false";
                        if (dateInput) dateInput.value = window.getLocalDateString();
                    }

                    if (typeof updatePendingCount === 'function') await updatePendingCount();
                    await window.renderFeesList();
                    await window.showReceiptModal(receiptIdToPrint);

                    if (navigator.onLine && typeof triggerAutoSync === 'function') triggerAutoSync();

                } catch (err) {
                    console.error("বেতন সেভে ত্রুটি:", err);
                    showToast("ডাটা সেভ করা সম্ভব হয়নি!", "error");
                }
            };
        }
    };

    async function loadDynamicFeeSessions(defaultConfigSession) {
        const formSession = document.getElementById('fee-session-year');
        const filterSession = document.getElementById('filter-fee-session');
        if (!formSession || !filterSession) return;

        let sessionsSet = new Set();
        const currentYear = new Date().getFullYear();
        sessionsSet.add(currentYear.toString());
        sessionsSet.add((currentYear + 1).toString());

        if (defaultConfigSession) sessionsSet.add(defaultConfigSession.toString());

        try {
            const rawFees = await db.fees.toArray();
            rawFees.forEach(f => { if (f.session_year) sessionsSet.add(f.session_year.toString()); });
            const rawStudents = await db.students.toArray();
            rawStudents.forEach(s => { if (s.session_year) sessionsSet.add(s.session_year.toString()); });
        } catch(e){}

        const sortedSessions = Array.from(sessionsSet).sort((a, b) => b.localeCompare(a));
        const optionsHtml = sortedSessions.map(s => `<option value="${s}">${s}</option>`).join('');

        formSession.innerHTML = optionsHtml;
        filterSession.innerHTML = `<option value="">সকল সেশন</option>` + optionsHtml;

        const initialVal = defaultConfigSession || currentYear.toString();
        formSession.value = initialVal;
        filterSession.value = initialVal;
    }

    // ছাত্র সিলেক্ট, লাইভ সেটিংস ফি গ্রুপ ম্যাচিং ও বিগত বকেয়া লেজার ক্যালকুলেশন
    window.selectStudentForFee = async function(id, name, studentClass, roll) {
        const student = allActiveStudents.find(s => s.id === id);
        if (!student) return;

        document.getElementById('fee-student-id').value = id;
        document.getElementById('student-search-input').value = `${name} (${studentClass} - রোল: ${roll || '-'})`;
        document.getElementById('student-search-results').classList.add('hidden');

        const studentFees = await db.fees.where('student_id').equals(id).toArray();
        const activeFees = studentFees.filter(f => f.is_deleted !== 1);
        activeFees.sort((a, b) => (b.payment_date || '').localeCompare(a.payment_date || ''));

        const lastFee = activeFees[0];
        const lastPaidMonth = lastFee ? lastFee.month : "কোনো রেকর্ড নেই";

        // ★ ১. সেটিংস ফি গ্রুপ থেকে লাইভ রেট ম্যাচিং (Fallback to student profile) ★
        const matchedFeeGroup = feeGroupsList.find(fg => fg.id === student.fee_group_id || fg.name === student.fee_group_name);
        
        let defaultAmount = 0;
        let feeGroupName = "সাধারণ ফি";

        if (matchedFeeGroup && matchedFeeGroup.amount !== undefined) {
            defaultAmount = parseFloat(matchedFeeGroup.amount) || 0;
            feeGroupName = matchedFeeGroup.name;
        } else {
            defaultAmount = parseFloat(student.monthly_fee) || 0;
            feeGroupName = student.fee_group_name || "সাধারণ ফি";
        }

        document.getElementById('fee-amount').value = defaultAmount;
        suggestNextMonth(lastPaidMonth);

        // ★ ২. স্বয়ংক্রিয় বিগত বকেয়া হিসাব ★
        await updateCalculatedPreviousDue(id);

        const calculatedPrevDue = parseFloat(document.getElementById('fee-previous-due').value) || 0;

        const quickInfo = document.getElementById('student-quick-info');
        if (quickInfo) {
            quickInfo.innerHTML = `
                <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-100 rounded-xl p-3 text-xs space-y-1.5 text-emerald-950 mb-2 shadow-sm">
                    <div class="flex justify-between font-bold border-b pb-1">
                        <span>${student.name}</span>
                        <span class="font-en text-emerald-800 font-bold">${student.id}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-1 text-[10.5px] text-gray-600">
                        <div>জামাত: <strong class="text-gray-800">${studentClass}</strong></div>
                        <div>রোল নম্বর: <strong class="text-gray-800 font-en">${roll || '-'}</strong></div>
                        <div>ফি গ্রুপ: <strong class="text-gray-800">${feeGroupName}</strong></div>
                        <div>ফোন: <strong class="text-gray-800 font-en">${student.parent_phone || '-'}</strong></div>
                    </div>
                    <div class="flex justify-between text-[10.5px] pt-1 border-t border-emerald-100/60">
                        <span>সর্বশেষ পরিশোধিত: <strong class="text-emerald-700">${lastPaidMonth}</strong></span>
                        <span>বিগত বকেয়া: <strong class="text-rose-700 font-en font-bold">৳ ${calculatedPrevDue.toLocaleString('bn-BD')}</strong></span>
                    </div>
                </div>`;

        }

        document.getElementById('fee-paid-amount').dataset.manual = "false";

    // ভর্তি তারিখ ও অতীত রসিদ অনুযায়ী বিগত বকেয়া নির্ণয় (লাইভ রেটসহ)
    async function updateCalculatedPreviousDue(studentId) {
        const student = allActiveStudents.find(s => s.id === studentId);
        if (!student) return;

        const selectedMonth = document.getElementById('fee-month')?.value || '';
        
        // লাইভ ফি রেট
        const matchedFeeGroup = feeGroupsList.find(fg => fg.id === student.fee_group_id || fg.name === student.fee_group_name);
        const monthlyFee = matchedFeeGroup && matchedFeeGroup.amount !== undefined 
            ? (parseFloat(matchedFeeGroup.amount) || 0) 
            : (parseFloat(student.monthly_fee) || 0);

        const openingDue = parseFloat(student.previous_due) || 0;

        // ভর্তির মাস নির্ণয়
        let admMonthIdx = 0;
        if (student.admission_date) {
            const parts = student.admission_date.split('-');
            if (parts.length >= 2) {
                const mNum = parseInt(parts[1], 10);
                if (!isNaN(mNum) && mNum >= 1 && mNum <= 12) {
                    admMonthIdx = mNum - 1;
                }
            }
        }

        const bnMonths = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
        let targetMonthIdx = bnMonths.indexOf(selectedMonth);
        if (targetMonthIdx === -1) targetMonthIdx = new Date().getMonth();

        // নির্বাচিত মাসের পূর্ববর্তী সক্রিয় মাসসমূহ
        let priorMonthsCount = 0;
        if (targetMonthIdx > admMonthIdx) {
            priorMonthsCount = targetMonthIdx - admMonthIdx;
        }

        const priorBilledFee = (priorMonthsCount * monthlyFee) + openingDue;

        // অতীতের পরিশোধিত টাকা
        const studentFees = await db.fees.where('student_id').equals(studentId).toArray();
        const editReceiptId = document.getElementById('editing-receipt-id')?.value;

        let totalPaidPrior = 0;
        let totalDiscountPrior = 0;

        studentFees.forEach(f => {
            if (f.is_deleted !== 1 && f.receipt_id !== editReceiptId) {
                const fMonthIdx = bnMonths.indexOf(f.month);
                if (fMonthIdx !== -1 && fMonthIdx < targetMonthIdx) {
                    totalPaidPrior += parseFloat(f.total || f.paid_amount || f.amount || 0);
                    totalDiscountPrior += parseFloat(f.discount || 0);
                }
            }
        });

        const runningPreviousDue = Math.max(0, priorBilledFee - totalDiscountPrior - totalPaidPrior);
        const prevDueInput = document.getElementById('fee-previous-due');
        if (prevDueInput) {
            prevDueInput.value = runningPreviousDue;
        }
    }

    window.onFeeMonthChange = async function() {
        const studentId = document.getElementById('fee-student-id').value;
        if (studentId) {
            await updateCalculatedPreviousDue(studentId);
        }
        window.calculateTotal();
    };

    function suggestNextMonth(lastPaidMonth) {
        const bnMonths = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
        let nextIndex = 0;
        if (lastPaidMonth && bnMonths.includes(lastPaidMonth)) {
            const index = bnMonths.indexOf(lastPaidMonth);
            nextIndex = (index + 1) % 12;
        } else {
            nextIndex = new Date().getMonth();
        }
        const monthSelect = document.getElementById('fee-month');
        if (monthSelect) monthSelect.value = bnMonths[nextIndex];
    }

    // মোট পাওনা ও আদায় হিসাব
    window.calculateTotal = function() {
        const amount = parseFloat(document.getElementById('fee-amount').value) || 0;
        const fine = parseFloat(document.getElementById('fee-fine').value) || 0;
        const discount = parseFloat(document.getElementById('fee-discount').value) || 0;
        const prevDue = parseFloat(document.getElementById('fee-previous-due').value) || 0;

        const totalPayable = Math.max(0, amount + fine + prevDue - discount);
        document.getElementById('fee-total').textContent = totalPayable.toLocaleString('bn-BD');

        const paidInput = document.getElementById('fee-paid-amount');
        if (paidInput) {
            if (paidInput.dataset.manual !== 'true') {
                paidInput.value = totalPayable;
            }
            window.calculateRemainingDue();
        }
    };

    // অবশিষ্ট বকেয়া নির্ণয়
    window.calculateRemainingDue = function() {
        const amount = parseFloat(document.getElementById('fee-amount').value) || 0;
        const fine = parseFloat(document.getElementById('fee-fine').value) || 0;
        const discount = parseFloat(document.getElementById('fee-discount').value) || 0;
        const prevDue = parseFloat(document.getElementById('fee-previous-due').value) || 0;

        const totalPayable = Math.max(0, amount + fine + prevDue - discount);
        const actualPaid = parseFloat(document.getElementById('fee-paid-amount').value) || 0;

        const remainingDue = Math.max(0, totalPayable - actualPaid);
        document.getElementById('fee-remaining-due').textContent = remainingDue.toLocaleString('bn-BD');
    };

            mobileContainer.innerHTML = mobileHtml;

        } catch (err) {
            console.error(err);
        }
    };

    window.editFee = async function(receiptId) {
        try {
            const fee = await db.fees.get(receiptId);
            if (!fee) return;

            document.getElementById('editing-receipt-id').value = fee.receipt_id;
            document.getElementById('fee-student-id').value = fee.student_id;
            document.getElementById('student-search-input').value = `${fee.student_name} (${fee.student_class} - রোল: ${fee.student_roll || '-'})`;
            document.getElementById('fee-session-year').value = fee.session_year || '2026';
            document.getElementById('fee-amount').value = fee.amount;
            document.getElementById('fee-fine').value = fee.fine || 0;
            document.getElementById('fee-discount').value = fee.discount || 0;
            document.getElementById('fee-previous-due').value = fee.previous_due || fee.previous_due_paid || 0;
            document.getElementById('fee-paid-amount').value = fee.paid_amount || fee.total || fee.amount;
            document.getElementById('fee-paid-amount').dataset.manual = "true";
            document.getElementById('fee-month').value = fee.month;
            document.getElementById('fee-method').value = fee.method || 'ক্যাশ';
            document.getElementById('fee-date').value = fee.payment_date;
            document.getElementById('fee-note').value = fee.note || '';

            window.calculateTotal();

            document.getElementById('fee-form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-600"></i> ফি আদায় সংশোধন`;
            const submitBtn = document.getElementById('fee-submit-btn');
            if (submitBtn) {
                submitBtn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition text-xs shadow-md cursor-pointer";
                submitBtn.innerHTML = `<i class="fa-solid fa-circle-check"></i> সংশোধন সম্পন্ন করুন`;
            }

            const cancelBtn = document.getElementById('cancel-fee-edit-btn');
            if (cancelBtn) cancelBtn.classList.remove('hidden');

            document.getElementById('fees-container')?.scrollIntoView({ behavior: 'smooth' });

        } catch (err) {
            console.error(err);
        }
    };

    window.cancelFeeEdit = function() {
        const form = document.getElementById('fees-form');
        if (form) form.reset();
        
        document.getElementById('editing-receipt-id').value = "";
        document.getElementById('fee-student-id').value = "";
        document.getElementById('student-quick-info')?.classList.add('hidden');
        document.getElementById('fee-total').textContent = "0";
        document.getElementById('fee-remaining-due').textContent = "0";
        document.getElementById('fee-paid-amount').dataset.manual = "false";

        const dateInput = document.getElementById('fee-date');
        if (dateInput) dateInput.value = window.getLocalDateString();

        document.getElementById('fee-form-title').innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-600"></i> নতুন বেতন কালেকশন`;
        const submitBtn = document.getElementById('fee-submit-btn');
        if (submitBtn) {
            submitBtn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition text-xs shadow-md cursor-pointer";
            submitBtn.innerHTML = `<i class="fa-solid fa-circle-check"></i> পেমেন্ট নিশ্চিত করুন`;
        }

        document.getElementById('cancel-fee-edit-btn')?.classList.add('hidden');
    };

    window.deleteFee = async function(receiptId) {
        if (!confirm("আপনি কি নিশ্চিতভাবে এই ফি আদায়ের রসিদটি মুছে ফেলতে চান?")) return;

        try {
            await db.fees.update(receiptId, { is_deleted: 1, is_synced: 0 });
            showToast("ফি আদায়ের তথ্য মুছে ফেলা হয়েছে।", "success");

            if (document.getElementById('editing-receipt-id').value === receiptId) window.cancelFeeEdit();
            if (typeof updatePendingCount === 'function') await updatePendingCount();
            await window.renderFeesList();

            if (navigator.onLine && typeof triggerAutoSync === 'function') triggerAutoSync();

        } catch (err) {
            showToast("মুছে ফেলতে ব্যর্থ!", "error");
        }
    };

    window.exportToExcel = function() {
        if (filteredFeesArray.length === 0) {
            showToast("কোনো আদায়ের তথ্য পাওয়া যায়নি!", "error");
            return;
        }
        
        const data = filteredFeesArray.map(f => ({
            'Receipt ID': f.receipt_id,
            'Session Year': f.session_year || '2026',
            'Student ID': f.student_id,
            'Student Name': f.student_name,
            'Roll': f.student_roll,
            'Class': f.student_class,
            'Monthly Fee': f.amount,
            'Fine': f.fine || 0,
            'Previous Due': f.previous_due || 0,
            'Discount': f.discount || 0,
            'Total Payable': f.total_payable || f.amount,
            'Paid Amount': f.total || f.amount,
            'Remaining Due': f.remaining_due || 0,
            'Month': f.month,
            'Method': f.method,
            'Payment Date': f.payment_date,
            'Note': f.note || ''
        }));

        try {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Fees");
            XLSX.writeFile(wb, `Fees_Collection_${window.getLocalDateString()}.xlsx`);
            showToast("এক্সেল ফাইল ডাউনলোড শুরু হয়েছে।", "success");
        } catch (err) {
            showToast("এক্সেল ফাইল তৈরি করতে সমস্যা হয়েছে!", "error");
        }
    };

    window.importFromExcel = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                const curUser = window.currentUser ? window.currentUser.username : "system";
                const importData = jsonData.map((row, i) => ({
                    receipt_id: row['Receipt ID'] ? row['Receipt ID'].toString() : 'R-' + (Date.now() + i),
                    session_year: row['Session Year'] || '2026',
                    student_id: (row['Student ID'] || '').toString(),
                    student_name: (row['Student Name'] || 'অজানা').toString(),
                    student_class: (row['Class'] || '').toString(),
                    student_roll: parseInt(row['Roll']) || 0,
                    amount: parseFloat(row['Monthly Fee'] || row['Amount']) || 0,
                    fine: parseFloat(row['Fine']) || 0,
                    discount: parseFloat(row['Discount']) || 0,
                    previous_due: parseFloat(row['Previous Due'] || row['Previous Due Paid']) || 0,
                    total: parseFloat(row['Paid Amount'] || row['Total']) || 0,
                    paid_amount: parseFloat(row['Paid Amount'] || row['Total']) || 0,
                    remaining_due: parseFloat(row['Remaining Due']) || 0,
                    month: (row['Month'] || '').toString(),
                    method: (row['Method'] || 'ক্যাশ').toString(),
                    payment_date: (row['Payment Date'] || window.getLocalDateString()).toString(),
                    note: (row['Note'] || '').toString(),
                    is_synced: 0,
                    is_deleted: 0,
                    created_by: curUser,
                    updated_by: curUser
                }));

                await db.fees.bulkPut(importData);
                showToast(`${importData.length}টি ফি রসিদ সফলভাবে ইমপোর্ট হয়েছে!`, "success");
                if (typeof updatePendingCount === 'function') await updatePendingCount();
                await window.initFees();
            } catch (err) {
                showToast("ফাইল ইমপোর্ট করতে সমস্যা হয়েছে!", "error");
            }
        };
        reader.readAsArrayBuffer(file);
    };

    // A5 সাইজ ফি রসিদ মডাল

    window.showReceiptModalFromList = function(receiptId) {

        document.getElementById('receipt-modal')?.classList.add('hidden');

    // A5 সাইজে সরাসরি ফি রসিদ পিডিএফ ডাউনলোড
    window.downloadFeeReceiptPDF = function() {
        if (!activePrintedFee) return;
        const element = document.getElementById('receipt-print-area');

        const opt = {
            margin: [4, 4, 4, 4],
            filename: `${activePrintedFee.receipt_id}_${activePrintedFee.student_name}_receipt.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a5', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        showToast("A5 রসিদ পিডিএফ প্রস্তুত হচ্ছে...", "info");
        html2pdf().set(opt).from(element).save().then(() => {
            showToast("রসিদ পিডিএফ ডাউনলোড সম্পন্ন!", "success");
        }).catch(err => {

            showToast("পিডিএফ ডাউনলোডে সমস্যা হয়েছে!", "error");

    // A4 সাইজে সমগ্র কালেকশন তালিকা পিডিএফ ডাউনলোড
    window.downloadFeesReportPDF = async function() {
        if (filteredFeesArray.length === 0) {
            showToast("কোনো আদায়ের তথ্য পাওয়া যায়নি!", "error");
            return;
        }

        const config = await fetchMadrasahConfig();
        const mName = config.madrasah_name || localStorage.getItem('madrasah_name') || 'মাদরাসা ম্যানেজমেন্ট বাই শরীফ';
        const mAddr = config.madrasah_address || localStorage.getItem('madrasah_address') || 'ঠিকানা';
        const sessionYear = document.getElementById('filter-fee-session')?.value || 'সকল সেশন';
        const monthVal = document.getElementById('filter-fee-month')?.value || 'সকল মাস';

        let totalSum = 0;
        const rowsHtml = filteredFeesArray.map((f, i) => {
            const amt = parseFloat(f.total || f.amount) || 0;
            totalSum += amt;
            return `
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 6px 8px;">${i + 1}</td>
                    <td style="padding: 6px 8px; font-family: 'Inter', sans-serif;">${f.receipt_id}<br><small style="color: #6b7280;">${f.payment_date}</small></td>
                    <td style="padding: 6px 8px;"><strong>${f.student_name}</strong><br><small style="color: #6b7280;">ID: ${f.student_id} | জামাত: ${f.student_class} (রোল: ${f.student_roll || '-'})</small></td>
                    <td style="padding: 6px 8px;">${f.month}</td>
                    <td style="padding: 6px 8px;">${f.method || 'ক্যাশ'}</td>
                    <td style="padding: 6px 8px; text-align: right; font-family: 'Inter', sans-serif; font-weight: bold; color: #065f46;">৳ ${amt.toLocaleString('bn-BD')}</td>
                </tr>`;

        const container = document.getElementById('hidden-report-pdf-area');
        container.innerHTML = `
            <div style="padding: 20px; font-family: 'Hind Siliguri', sans-serif; color: #1f2937; background: #fff;">
                <div style="text-align: center; border-bottom: 2px solid #065f46; padding-bottom: 10px; margin-bottom: 15px;">

                    <p style="font-size: 11px; color: #4b5563; margin: 3px 0;">${mAddr}</p>

                    <p style="font-size: 10px; color: #6b7280; margin: 4px 0 0 0;">সেশন: ${sessionYear} | মাস: ${monthVal} | তারিখ: ${window.getLocalDateString()}</p>
                </div>

                <table style="width: 100%; border-collapse: collapse; font-size: 11px; text-align: left;">
                    <thead>
                        <tr style="background-color: #f3f4f6; color: #374151; border-bottom: 2px solid #d1d5db;">
                            <th style="padding: 8px;">#</th>
                            <th style="padding: 8px;">রসিদ ও তারিখ</th>
                            <th style="padding: 8px;">তালিবে ইলম বিবরণ</th>
                            <th style="padding: 8px;">মাস</th>
                            <th style="padding: 8px;">মাধ্যম</th>
                            <th style="padding: 8px; text-align: right;">মোট আদায়</th>

                    <tbody>

                </div>
            </div>`;

        const opt = {
            margin: [6, 6, 6, 6],
            filename: `Fees_Report_${sessionYear}_${monthVal}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        showToast("A4 রিপোর্ট পিডিএফ প্রস্তুত হচ্ছে...", "info");

            console.error("রিপোর্ট PDF সমস্যা:", err);
            showToast("রিপোর্ট পিডিএফ ডাউনলোডে সমস্যা হয়েছে!", "error");

    window.sendFeeReceiptToWhatsApp = function() {
        if (!activePrintedFee) return;

        let phone = (activePrintedFee.parent_phone || "").replace(/\D/g, ''); 
        if (phone.startsWith('0')) phone = '88' + phone; 

        const madrasahName = madrasahConfig.madrasah_name || localStorage.getItem('madrasah_name') || 'মাদরাসা ম্যানেজমেন্ট বাই শরীফ';
        const madrasahId = localStorage.getItem('active_madrasah_id') || '';
        const portalUrl = `${window.location.origin}${window.location.pathname}?m=${madrasahId}&p=${activePrintedFee.student_id}`;

        const remDue = parseFloat(activePrintedFee.remaining_due || 0);

        const msg = `আসসালামু আলাইকুম।
আপনার সন্তান ${activePrintedFee.student_name}-এর ${activePrintedFee.month} মাসের বেতন বাবদ সর্বমোট ৳${activePrintedFee.total || activePrintedFee.amount} (${activePrintedFee.method}) গৃহীত হয়েছে।
${remDue > 0 ? `অবশিষ্ট বকেয়া: ৳${remDue}\n` : ''}
রসিদ নং: ${activePrintedFee.receipt_id}
অভিভাবক পোর্টালে বিস্তারিত দেখুন: ${portalUrl}
ধন্যবাদ, ${madrasahName}`;

        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    };
})();
