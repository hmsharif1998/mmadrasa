<!-- হিডেন কনটেইনার: A4 স্টুডেন্ট লিস্ট রিপোর্ট পিডিএফ জেনারেট করার জন্য -->
<div id="hidden-student-report-area" class="hidden"></div>

<script>
(function() {
    let filteredStudentsArray = [];
    let allStudentsCache = [];
    let academicStructure = [];
    let feeGroups = [];
    let madrasahConfig = {};
    let activeProfileStudent = null;

    let currentPage = 1;
    let pageSize = 15;

    async function fetchMadrasahConfig() {
        try {
            let config = await db.settings.get('madrasah_config_block');
            if (!config) {
                const allSettings = await db.settings.toArray();
                if (allSettings && allSettings.length > 0) config = allSettings[0];
            }
            madrasahConfig = config || {};
        } catch(e) {
            madrasahConfig = {};
        }
        return madrasahConfig;
    }

    // ইউনিভার্সাল ইনিশিয়ালাইজেশন
    window.initStudentlist = async function() {
        await window.initStudentList();
    };

    window.initStudentList = async function() {
        const config = await fetchMadrasahConfig();
        academicStructure = config.academic_structure ? JSON.parse(config.academic_structure) : [];
        feeGroups = config.fee_groups ? JSON.parse(config.fee_groups) : [];

        await loadDynamicSessions(config.current_session);
        populateDynamicFilters();

        const bnMonths = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
        const monthSelect = document.getElementById('filter-month');
        if (monthSelect) monthSelect.value = bnMonths[new Date().getMonth()];

        const sizeSelect = document.getElementById('filter-page-size');
        if (sizeSelect) pageSize = parseInt(sizeSelect.value, 10) || 15;

        currentPage = 1;
        window.loadColumnChooserSettings();
        await window.renderFilteredStudents();

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('column-chooser-menu');
            const wrapper = document.getElementById('column-chooser-wrapper');
            if (menu && wrapper && !wrapper.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });
    };

    async function loadDynamicSessions(defaultSession) {
        const sSelect = document.getElementById('filter-session-list');
        if (!sSelect) return;

        let sessionsSet = new Set();
        const currentYear = new Date().getFullYear();
        sessionsSet.add(currentYear.toString());
        sessionsSet.add((currentYear + 1).toString());
        if (defaultSession) sessionsSet.add(defaultSession.toString());

        try {
            const students = await db.students.toArray();
            students.forEach(s => { if (s.session_year) sessionsSet.add(s.session_year.toString()); });
        } catch(e){}

        const sorted = Array.from(sessionsSet).sort((a, b) => b.localeCompare(a));
        sSelect.innerHTML = sorted.map(s => `<option value="${s}">${s}</option>`).join('');
        sSelect.value = defaultSession || currentYear.toString();
    }

    function populateDynamicFilters() {
        const bSelect = document.getElementById('filter-branch-list');
        const cSelect = document.getElementById('filter-class-list');
        const fgSelect = document.getElementById('filter-fee-group-list');

        if (bSelect) {
            bSelect.innerHTML = `<option value="">সকল শাখা</option>`;
            academicStructure.forEach(b => bSelect.innerHTML += `<option value="${b.name}">${b.name}</option>`);
        }

        if (cSelect) {
            cSelect.innerHTML = `<option value="">সকল জামাত</option>`;
            const classesSet = new Set();
            academicStructure.forEach(b => (b.departments || []).forEach(d => (d.classes || []).forEach(c => classesSet.add(c.name))));
            classesSet.forEach(c => cSelect.innerHTML += `<option value="${c}">${c}</option>`);
        }

        if (fgSelect) {
            fgSelect.innerHTML = `<option value="">সকল ফি গ্রুপ</option>`;
            feeGroups.forEach(fg => fgSelect.innerHTML += `<option value="${fg.name}">${fg.name}</option>`);
        }
    }

    window.onBranchFilterChange = function() {
        const bVal = document.getElementById('filter-branch-list')?.value || '';
        const cSelect = document.getElementById('filter-class-list');
        if (!cSelect) return;

        cSelect.innerHTML = `<option value="">সকল জামাত</option>`;
        const classesSet = new Set();

        const branchesToSearch = bVal ? academicStructure.filter(b => b.name === bVal) : academicStructure;
        branchesToSearch.forEach(b => (b.departments || []).forEach(d => (d.classes || []).forEach(c => classesSet.add(c.name))));
        classesSet.forEach(c => cSelect.innerHTML += `<option value="${c}">${c}</option>`);

        window.renderFilteredStudents();
    };

    window.toggleColumnMenu = function() {
        document.getElementById('column-chooser-menu')?.classList.toggle('hidden');
    };

    window.toggleColumn = function(colClass) {
        const chk = document.getElementById(`chk-${colClass}`);
        if (!chk) return;
        const isChecked = chk.checked;
        document.querySelectorAll(`.${colClass}`).forEach(el => {
            if (isChecked) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
        localStorage.setItem(`col_visible_${colClass}`, isChecked ? 'true' : 'false');
    };

    window.loadColumnChooserSettings = function() {
        ['col-roll-id', 'col-student', 'col-parents', 'col-academic', 'col-contact', 'col-status', 'col-actions'].forEach(col => {
            const savedState = localStorage.getItem(`col_visible_${col}`);
            const chk = document.getElementById(`chk-${col}`);
            if (savedState !== null && chk) {
                chk.checked = savedState === 'true';
            }
        });
    };

    window.onPageSizeChange = async function() {
        const sizeSelect = document.getElementById('filter-page-size');
        if (sizeSelect) pageSize = parseInt(sizeSelect.value, 10) || 15;
        currentPage = 1;
        await window.renderFilteredStudents(true);
    };

    window.changePage = async function(p) {
        currentPage = p;
        await window.renderFilteredStudents(true);
    };

    function renderPaginationControls(totalRecords) {
        const totalPages = Math.ceil(totalRecords / pageSize);
        const pagButtons = document.getElementById('pagination-buttons');
        if (!pagButtons) return;

        const startRange = totalRecords > 0 ? (currentPage - 1) * pageSize + 1 : 0;
        const endRange = Math.min(currentPage * pageSize, totalRecords);

        document.getElementById('pag-total-records').textContent = totalRecords.toLocaleString('bn-BD');
        document.getElementById('pag-range-start').textContent = startRange.toLocaleString('bn-BD');
        document.getElementById('pag-range-end').textContent = endRange.toLocaleString('bn-BD');

        if (totalRecords === 0 || totalPages <= 1) {
            pagButtons.innerHTML = '';
            return;
        }

        let html = `<button onclick="window.changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-xl border text-xs font-bold ${currentPage === 1 ? 'bg-gray-50 text-gray-300' : 'bg-white hover:bg-gray-50 text-gray-700'}">পূর্ববর্তী</button>`;

        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                html += `<button onclick="window.changePage(${i})" class="px-3 py-1.5 rounded-xl border text-xs font-bold font-en ${currentPage === i ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white hover:bg-gray-50 text-gray-700'}">${i}</button>`;
            } else if (i === currentPage - 3 || i === currentPage + 3) {
                html += `<span class="px-1 text-gray-400 text-xs">...</span>`;
            }
        }

        html += `<button onclick="window.changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-xl border text-xs font-bold ${currentPage === totalPages ? 'bg-gray-50 text-gray-300' : 'bg-white hover:bg-gray-50 text-gray-700'}">পরবর্তী</button>`;
        pagButtons.innerHTML = html;
    }

    window.renderFilteredStudents = async function(preservePage = false) {
        const tableBody = document.getElementById('student-list-table-body');
        const mobileContainer = document.getElementById('student-mobile-cards');
        if (!tableBody) return;

        if (!preservePage) currentPage = 1;

        const searchQuery = document.getElementById('search-student-list')?.value.toLowerCase().trim() || '';
        const sessionQuery = document.getElementById('filter-session-list')?.value || '';
        const branchQuery = document.getElementById('filter-branch-list')?.value || '';
        const classQuery = document.getElementById('filter-class-list')?.value || '';
        const feeGroupQuery = document.getElementById('filter-fee-group-list')?.value || '';
        const monthQuery = document.getElementById('filter-month')?.value || '';
        const paymentStatusQuery = document.getElementById('filter-payment-status')?.value || '';

        try {
            let students = await db.students.toArray();
            students = students.filter(s => s.is_deleted !== 1);
            allStudentsCache = students;

            let fees = await db.fees.toArray();
            const paidMap = {};
            fees.filter(f => f.is_deleted !== 1 && f.month === monthQuery && (!sessionQuery || f.session_year == sessionQuery)).forEach(f => {
                paidMap[f.student_id] = f;
            });

            let filtered = students;

            if (sessionQuery) filtered = filtered.filter(s => s.session_year == sessionQuery || !s.session_year);
            if (searchQuery) {
                filtered = filtered.filter(s =>
                    (s.name || '').toLowerCase().includes(searchQuery) ||
                    (s.id || '').toLowerCase().includes(searchQuery) ||
                    String(s.roll || '').includes(searchQuery) ||
                    (s.parent_phone || '').includes(searchQuery) ||
                    (s.whatsapp_number || '').includes(searchQuery)
                );
            }
            if (branchQuery) filtered = filtered.filter(s => s.branch === branchQuery);
            if (classQuery) filtered = filtered.filter(s => s.class === classQuery);
            if (feeGroupQuery) filtered = filtered.filter(s => (s.fee_group_name === feeGroupQuery) || (s.boarding_type === feeGroupQuery));

            if (paymentStatusQuery === 'paid') {
                filtered = filtered.filter(s => !!paidMap[s.id]);
            } else if (paymentStatusQuery === 'due') {
                filtered = filtered.filter(s => !paidMap[s.id]);
            }

            filtered.sort((a, b) => (parseInt(a.roll, 10) || 0) - (parseInt(b.roll, 10) || 0));
            filteredStudentsArray = filtered;

            let totalPaid = 0, totalDue = 0;
            filtered.forEach(s => { if (paidMap[s.id]) totalPaid++; else totalDue++; });
            const collectionRate = filtered.length > 0 ? Math.round((totalPaid / filtered.length) * 100) : 0;

            document.getElementById('stat-total').textContent = filtered.length.toLocaleString('bn-BD');
            document.getElementById('stat-paid').textContent = totalPaid.toLocaleString('bn-BD');
            document.getElementById('stat-due').textContent = totalDue.toLocaleString('bn-BD');
            document.getElementById('stat-ratio').textContent = collectionRate + "%";
            document.getElementById('stat-progress-bar').style.width = collectionRate + "%";

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-xs text-gray-500 font-bold">কোনো তালিবে ইলমের তথ্য পাওয়া যায়নি।</td></tr>`;
                mobileContainer.innerHTML = `<div class="text-center py-8 text-gray-400 font-bold">কোনো শিক্ষার্থী পাওয়া যায়নি।</div>`;
                renderPaginationControls(0);
                return;
            }

            const paginatedStudents = filtered.slice((currentPage - 1) * pageSize, currentPage * pageSize);

            let html = '';
            let mobileHtml = '';

            paginatedStudents.forEach(s => {
                const feeObj = paidMap[s.id];
                const statusCell = feeObj
                    ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800"><i class="fa-solid fa-circle-check"></i> পরিশোধিত (${feeObj.method || 'ক্যাশ'})</span>`
                    : `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 animate-pulse"><i class="fa-solid fa-circle-xmark"></i> বকেয়া</span>`;

                html += `
                    <tr class="hover:bg-gray-50 transition border-b border-gray-100 text-gray-700">
                        <td class="px-3 py-2.5 text-xs col-roll-id font-bold font-en">
                            <div class="text-emerald-950 font-bold text-xs">রোল: ${s.roll || '-'}</div>
                            <div class="text-[10px] text-gray-400 font-bold">${s.id}</div>
                        </td>
                        <td class="px-3 py-2.5 text-xs col-student">
                            <div class="flex items-center gap-2">
                                ${s.photo_url ? `<img class="w-8 h-8 rounded-full object-cover border border-emerald-200" src="${s.photo_url}">` : '<div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-800 flex items-center justify-center font-bold text-[10px]">St</div>'}
                                <div>
                                    <button onclick="window.showStudentProfile('${s.id}')" class="text-emerald-950 hover:text-emerald-700 font-bold text-xs text-left truncate block">${s.name || 'অজানা'}</button>

                        </td>
                        <td class="px-3 py-2.5 text-xs font-bold col-academic">
                            <div class="text-emerald-950">${s.class} ${s.group && s.group !== '-' ? `(${s.group})` : ''}</div>
                            <div class="text-[10px] text-gray-400 font-normal">${s.branch}</div>
                        </td>
                        <td class="px-3 py-2.5 text-xs col-contact">
                            <div class="font-en font-bold text-gray-800">${s.parent_phone || '-'}</div>
                            <div class="text-[10px] text-emerald-800 font-bold">${s.fee_group_name || s.boarding_type || 'সাধারণ'} (৳${s.monthly_fee || 0})</div>

                                <button onclick="window.showStudentProfile('${s.id}')" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 p-1.5 rounded-lg transition" title="বায়োডাটা ও A5 পিডিএফ">

                                <button onclick="window.editStudentFromList('${s.id}')" class="bg-blue-50 text-blue-700 hover:bg-blue-100 p-1.5 rounded-lg transition" title="সম্পাদন করুন">
                                    <i class="fa-solid fa-pen-to-square text-sm"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;

                mobileHtml += `
                    <div class="p-3.5 rounded-xl border border-gray-150 bg-white shadow-sm space-y-2 text-xs">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-2">
                                ${s.photo_url ? `<img class="w-9 h-9 rounded-full object-cover border border-emerald-200" src="${s.photo_url}">` : '<div class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold text-xs">St</div>'}
                                <div>
                                    <h5 class="font-bold text-gray-900 text-xs">${s.name}</h5>
                                    <p class="text-[10px] text-gray-400 font-en">রোল: ${s.roll} | ID: ${s.id}</p>
                                </div>
                            </div>
                            ${statusCell}
                        </div>
                        <div class="border-t border-dashed pt-1.5 flex justify-between items-center text-[11px] text-gray-600">
                            <div><span class="text-gray-400">জামাত:</span> ${s.class} (${s.branch})</div>
                            <div class="flex gap-1.5">
                                <button onclick="window.sendParentPortalLinkWA('${s.id}')" class="bg-green-50 text-green-600 p-1.5 rounded" title="হোয়াটসঅ্যাপ"><i class="fa-brands fa-whatsapp"></i></button>
                                <button onclick="window.showStudentProfile('${s.id}')" class="bg-emerald-50 text-emerald-700 p-1.5 rounded" title="বায়োডাটা"><i class="fa-solid fa-file-pdf"></i></button>
                                <button onclick="window.editStudentFromList('${s.id}')" class="bg-blue-50 text-blue-700 p-1.5 rounded" title="এডিট"><i class="fa-solid fa-pen-to-square"></i></button>

            tableBody.innerHTML = html;

            window.loadColumnChooserSettings();

        } catch (err) {
            console.error(err);
        }
    };

    window.sendParentPortalLinkWA = function(studentId) {
        const s = allStudentsCache.find(item => item.id === studentId);
        if (!s) return;

        let phone = (s.whatsapp_number || s.parent_phone || '').replace(/\D/g, '');
        if (phone.startsWith('0')) phone = '88' + phone;

        const mName = madrasahConfig.madrasah_name || localStorage.getItem('madrasah_name') || 'মাদরাসাতুল মদিনা';
        const portalUrl = `${window.location.origin}${window.location.pathname}?p=${s.id}`;

        const msg = `আসসালামু আলাইকুম।
${mName} থেকে জানানো যাচ্ছে যে, আপনার সন্তান ${s.name}-এর প্রোফাইল ও রেজাল্ট লিঙ্ক: ${portalUrl}

প্যানেলে প্রবেশ করতে আপনার নিবন্ধিত মোবাইল নম্বরের শেষ ৪ ডিজিট পিন হিসেবে ব্যবহার করুন। ধন্যবাদ।`;

        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    };

        const classVal = document.getElementById('filter-class-list')?.value || 'সকল জামাত';
        const feeGroupVal = document.getElementById('filter-fee-group-list')?.value || 'সকল ফি গ্রুপ';
        const monthVal = document.getElementById('filter-month')?.value || 'চলতি মাস';
        const paymentStatusVal = document.getElementById('filter-payment-status')?.value || '';
        const searchVal = document.getElementById('search-student-list')?.value.trim() || '';

        // পেমেন্ট স্ট্যাটাস টেক্সট
        let statusText = 'সকল (পরিশোধিত ও বকেয়া)';
        if (paymentStatusVal === 'paid') statusText = 'পরিশোধিত তালিকা';
        else if (paymentStatusVal === 'due') statusText = 'বকেয়া তালিকা';

        const rowsHtml = filteredStudentsArray.map((s, i) => `
            <tr style="border-bottom: 1px solid #e5e7eb;">
                <td style="padding: 5px 6px; text-align: center;">${i + 1}</td>
                <td style="padding: 5px 6px; font-family: 'Inter', sans-serif; font-weight: bold; color: #064e3b;">${s.roll || '-'}<br><small style="color: #6b7280;">${s.id}</small></td>
                <td style="padding: 5px 6px;"><strong>${s.name}</strong><br><small style="color: #4b5563;">পিতা: ${s.father_name || '-'}</small></td>
                <td style="padding: 5px 6px;">${s.class} ${s.group && s.group !== '-' ? `(${s.group})` : ''}<br><small style="color: #6b7280;">${s.branch}</small></td>
                <td style="padding: 5px 6px; font-family: 'Inter', sans-serif;">${s.parent_phone || '-'}<br><small style="color: #065f46; font-weight: bold;">${s.fee_group_name || s.boarding_type || 'সাধারণ'}</small></td>
                <td style="padding: 5px 6px; font-family: 'Inter', sans-serif; text-align: right; font-weight: bold; color: #065f46;">৳ ${s.monthly_fee || 0}</td>
            </tr>`).join('');

        const container = document.getElementById('hidden-student-report-area');
        container.innerHTML = `
            <div style="padding: 16px; font-family: 'Hind Siliguri', sans-serif; color: #1f2937; background: #fff;">
                
                <!-- হেডার ও লোগো -->
                <div style="text-align: center; border-bottom: 2px solid #065f46; padding-bottom: 8px; margin-bottom: 10px;">
                    <h2 style="font-size: 19px; font-weight: bold; color: #064e3b; margin: 0;">${mName}</h2>
                    <p style="font-size: 10.5px; color: #4b5563; margin: 2px 0;">${mAddr}</p>
                    <h3 style="font-size: 13px; font-weight: bold; color: #1f2937; margin: 6px 0 0 0; background: #ecfdf5; display: inline-block; padding: 2px 14px; border-radius: 6px; border: 1px solid #a7f3d0;">
                        তালিবে ইলমদের তথ্য রিপোর্ট
                    </h3>
                </div>

                <!-- বিস্তারিত ফিল্টার সারসংক্ষেপ বক্স (সকল ফিল্টারের তথ্য) -->
                <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 10px; line-height: 1.6;">
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;">
                        <div><strong style="color: #64748b;">শিক্ষাবর্ষ:</strong> <span style="font-weight: bold; color: #0f172a;">${sessionYear}</span></div>
                        <div><strong style="color: #64748b;">শাখা:</strong> <span style="font-weight: bold; color: #0f172a;">${branchVal}</span></div>
                        <div><strong style="color: #64748b;">জামাত/শ্রেণী:</strong> <span style="font-weight: bold; color: #0f172a;">${classVal}</span></div>
                        <div><strong style="color: #64748b;">ফি গ্রুপ:</strong> <span style="font-weight: bold; color: #0f172a;">${feeGroupVal}</span></div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; border-top: 1px dashed #cbd5e1; padding-top: 4px;">
                        <div><strong style="color: #64748b;">বেতনের মাস:</strong> <span style="font-weight: bold; color: #0f172a;">${monthVal}</span></div>
                        <div><strong style="color: #64748b;">স্ট্যাটাস:</strong> <span style="font-weight: bold; color: ${paymentStatusVal === 'due' ? '#dc2626' : '#059669'};">${statusText}</span></div>
                        <div><strong style="color: #64748b;">রিপোর্ট তৈরির তারিখ:</strong> <span style="font-weight: bold; color: #0f172a; font-family: 'Inter', sans-serif;">${window.getLocalDateString()}</span></div>
                        <div><strong style="color: #64748b;">মোট শিক্ষার্থী:</strong> <span style="font-weight: bold; color: #065f46; font-family: 'Inter', sans-serif;">${filteredStudentsArray.length} জন</span></div>
                    </div>
                    ${searchVal ? `<div style="margin-top: 3px; color: #64748b;"><strong>অনুসন্ধান কি-ওয়ার্ড:</strong> "${searchVal}"</div>` : ''}
                </div>

                <!-- মূল ডাটা টেবিল -->
                <table style="width: 100%; border-collapse: collapse; font-size: 10px; text-align: left;">
                    <thead>
                        <tr style="background-color: #f1f5f9; color: #334155; border-bottom: 2px solid #cbd5e1;">
                            <th style="padding: 6px; width: 30px; text-align: center;">#</th>
                            <th style="padding: 6px; width: 85px;">রোল ও আইডি</th>
                            <th style="padding: 6px;">তালিবে ইলমের নাম ও পিতা</th>
                            <th style="padding: 6px;">জামাত ও শাখা</th>
                            <th style="padding: 6px;">মোবাইল ও ফি গ্রুপ</th>
                            <th style="padding: 6px; text-align: right; width: 70px;">মাসিক ফি</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHtml}
                    </tbody>
                    <tfoot>
                        <tr style="background-color: #ecfdf5; font-weight: bold; border-top: 2px solid #065f46;">
                            <td colspan="5" style="padding: 6px 8px; text-align: right;">সর্বমোট শিক্ষার্থী:</td>
                            <td style="padding: 6px 8px; text-align: right; font-family: 'Inter', sans-serif; font-size: 11px; color: #064e3b;">${filteredStudentsArray.length} জন</td>
                        </tr>
                    </tfoot>
                </table>

                <!-- স্বাক্ষর সেকশন -->
                <div style="margin-top: 35px; display: flex; justify-content: space-between; font-size: 9.5px; color: #475569;">
                    <div style="border-top: 1px solid #94a3b8; width: 110px; text-align: center; padding-top: 3px;">নাযিমে তালিমাত</div>
                    <div style="border-top: 1px solid #94a3b8; width: 110px; text-align: center; padding-top: 3px;">হিসাবরক্ষক</div>
                    <div style="border-top: 1px solid #065f46; width: 110px; text-align: center; padding-top: 3px; color: #064e3b; font-weight: bold;">মুহতামিম</div>
                </div>
            </div>`;

        const opt = {
            margin: [5, 5, 5, 5],
            filename: `Student_Report_${sessionYear}_${classVal}_${monthVal}_${paymentStatusVal || 'all'}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        showToast("রিপোর্ট পিডিএফ প্রস্তুত হচ্ছে...", "info");
        html2pdf().set(opt).from(container.firstElementChild).save().then(() => {
            showToast("রিপোর্ট পিডিএফ ডাউনলোড সম্পন্ন হয়েছে!", "success");
            container.innerHTML = '';
        }).catch(err => {
            console.error("রিপোর্ট PDF সমস্যা:", err);
            showToast("রিপোর্ট পিডিএফ ডাউনলোডে সমস্যা হয়েছে!", "error");
        });
    };

    window.editStudentFromList = function(id) {
        window.closeProfileModal();
        window.preselectedStudentId = id; 
        loadModule('admission');
    };

    window.exportToExcel = function() {
        if (filteredStudentsArray.length === 0) {
            showToast("কোনো তালিবে ইলম পাওয়া যায়নি!", "error");
            return;
        }

        const data = filteredStudentsArray.map(s => ({
            'ID': s.id,
            'Session Year': s.session_year || '2026',
            'Name': s.name,
            'Roll': s.roll,
            'Class': s.class,
            'Branch': s.branch,
            'Group': s.group || '',
            'Fee Group': s.fee_group_name || s.boarding_type || '',
            'Father Name': s.father_name,
            'Mother Name': s.mother_name,
            'Phone': s.parent_phone,
            'WhatsApp': s.whatsapp_number || s.parent_phone,
            'Monthly Fee': s.monthly_fee,
            'Previous Due': s.previous_due || 0,
            'Address': s.permanent_address || s.address || ''
        }));

        try {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Students");
            XLSX.writeFile(wb, `Student_List_${window.getLocalDateString()}.xlsx`);
            showToast("এক্সেল ফাইল ডাউনলোড শুরু হয়েছে।", "success");
        } catch (err) {
            showToast("এক্সেল তৈরি করতে সমস্যা হয়েছে!", "error");
        }
    };

    window.importFromExcel = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                const curUser = window.currentUser ? window.currentUser.username : "system";
                const importData = jsonData.map((row, i) => ({
                    id: row['ID'] ? row['ID'].toString() : 'S-' + (Date.now() + i),
                    session_year: (row['Session Year'] || '2026').toString(),
                    name: (row['Name'] || 'অজানা').toString(),
                    roll: parseInt(row['Roll'], 10) || 0,
                    class: (row['Class'] || '').toString(),
                    branch: (row['Branch'] || '').toString(),
                    group: (row['Group'] || '-').toString(),
                    fee_group_name: (row['Fee Group'] || 'সাধারণ').toString(),
                    father_name: (row['Father Name'] || '').toString(),
                    mother_name: (row['Mother Name'] || '').toString(),
                    parent_phone: (row['Phone'] || '').toString(),
                    whatsapp_number: (row['WhatsApp'] || row['Phone'] || '').toString(),
                    monthly_fee: parseFloat(row['Monthly Fee']) || 500,
                    previous_due: parseFloat(row['Previous Due']) || 0,
                    address: (row['Address'] || '').toString(),
                    permanent_address: (row['Address'] || '').toString(),
                    is_synced: 0,
                    is_deleted: 0,
                    created_by: curUser,
                    updated_by: curUser,
                    admission_date: window.getLocalDateString()
                }));

                await db.students.bulkPut(importData);
                showToast(`${importData.length} জন তালিবে ইলমের ডাটা ইমপোর্ট হয়েছে!`, "success");
                if (typeof updatePendingCount === 'function') await updatePendingCount();
                await window.initStudentList();
            } catch (err) {
                showToast("ফাইল ইমপোর্ট করতে সমস্যা হয়েছে!", "error");
            }
        };
        reader.readAsArrayBuffer(file);
    };
})();
</script>
