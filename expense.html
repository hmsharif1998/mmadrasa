<div id="expense-container" class="space-y-6 bangla-font pb-12">

    <!-- খরচের রিয়্যাল-টাইম ও আর্থিক ভারসাম্য পরিসংখ্যান কার্ডসমূহ -->

<!-- হিডেন কনটেইনার: A4 ইখরাজাত অডিট রিপোর্ট PDF রেন্ডার করার জন্য -->
<div id="hidden-expense-report-pdf-area" class="hidden"></div>

<script>
(function() {
    let academicStructure = [];
    let allTeachersList = [];
    let filteredExpensesArray = [];
    let activePrintedExpense = null;
    let madrasahConfig = {};

    let selectedBranchName = "";
    let selectedCategoryName = "";
    const categories = ["বাজার", "শিক্ষকের বেতন", "ইউটিলিটি", "আপ্যায়ন", "নির্মাণ", "উত্তোলন", "মেরামত", "অন্যান্য"];

    async function fetchMadrasahConfig() {
        try {
            let config = await db.settings.get('madrasah_config_block');
            if (!config) {
                const allSettings = await db.settings.toArray();
                if (allSettings && allSettings.length > 0) config = allSettings[0];
            }
            madrasahConfig = config || {};
        } catch(e) {
            madrasahConfig = {};
        }
        return madrasahConfig;
    }

    window.initExpense = async function() {
        document.getElementById('editing-expense-id').value = "";
        document.getElementById('expense-date').value = window.getLocalDateString();

        const config = await fetchMadrasahConfig();
        academicStructure = config.academic_structure ? JSON.parse(config.academic_structure) : [];
        
        await loadDynamicExpenseSessions(config.current_session);
        await loadTeachersData();
        
        window.populateBranchDropdowns();
        window.populateCategoryTiles();

        await window.generateVoucherId();
        await window.renderExpensesList();

        const form = document.getElementById('expense-form');
        if (form) {
            form.onsubmit = async (e) => {
                e.preventDefault();

                const id = document.getElementById('expense-id').value;
                const sessionYearVal = document.getElementById('expense-session-year').value;
                const branch = selectedBranchName;
                const date = document.getElementById('expense-date').value;
                const categorySelect = selectedCategoryName;
                const categoryOther = document.getElementById('expense-category-other').value.trim();
                const teacherSelectVal = document.getElementById('expense-teacher-select').value;
                const amount = parseFloat(window.convertToEnglishDigits(document.getElementById('expense-amount').value)) || 0;
                const method = document.getElementById('expense-method').value;
                const paidTo = document.getElementById('expense-paid-to').value.trim();
                const voucherUrl = document.getElementById('expense-voucher-url').value.trim();
                const desc = document.getElementById('expense-desc').value.trim();
                const editId = document.getElementById('editing-expense-id').value;

                const category = categorySelect === "অন্যান্য" ? (categoryOther || "অন্যান্য") : categorySelect;

                if (!id || !branch || !date || !category || !amount || !paidTo) {
                    showToast("সকল লাল চিহ্নিত (*) ঘরগুলো সঠিকভাবে পূরণ করুন!", "error");
                    return;
                }

                const user = window.currentUser || JSON.parse(sessionStorage.getItem('currentUser'));
                const curUser = user ? user.username : "system";

                try {
                    const expenseObj = {
                        expense_id: id,
                        session_year: sessionYearVal,
                        branch: branch,
                        date: date,
                        category: category,
                        teacher_id: teacherSelectVal || "",
                        amount: amount,
                        method: method,
                        paid_to: paidTo,
                        voucher_url: voucherUrl,
                        description: desc,
                        is_synced: 0
                    };

                    if (editId) {
                        const existing = await db.expenses.get(editId);
                        expenseObj.created_by = existing ? existing.created_by : curUser;
                        expenseObj.updated_by = curUser;
                        expenseObj.is_deleted = existing ? existing.is_deleted : 0;

                        await db.expenses.update(editId, expenseObj);
                        showToast("খরচের ভাউচার সংশোধন করা হয়েছে।", "success");
                        window.cancelExpenseEdit();
                    } else {
                        expenseObj.is_deleted = 0;
                        expenseObj.created_by = curUser;
                        expenseObj.updated_by = curUser;

                        await db.expenses.add(expenseObj);
                        showToast("খরচ সফলভাবে এন্ট্রি করা হয়েছে।", "success");
                        form.reset();
                        document.getElementById('expense-date').value = window.getLocalDateString();
                    }

                    if (typeof updatePendingCount === 'function') await updatePendingCount();
                    await window.generateVoucherId();
                    await window.renderExpensesList();

                    await window.showVoucherModal(expenseObj);

                    if (navigator.onLine && typeof triggerAutoSync === 'function') triggerAutoSync();

                } catch (err) {
                    console.error("খরচ এন্ট্রিতে ত্রুটি:", err);
                    showToast("ডাটা সেভ করা সম্ভব হয়নি!", "error");
                }
            };
        }
    };

    async function loadDynamicExpenseSessions(defaultConfigSession) {
        const formSession = document.getElementById('expense-session-year');
        const filterSession = document.getElementById('filter-expense-session');
        if (!formSession || !filterSession) return;

        let sessionsSet = new Set();
        const currentYear = new Date().getFullYear();
        sessionsSet.add(currentYear.toString());
        sessionsSet.add((currentYear + 1).toString());
        if (defaultConfigSession) sessionsSet.add(defaultConfigSession.toString());

        try {
            const rawExpenses = await db.expenses.toArray();
            rawExpenses.forEach(e => { if (e.session_year) sessionsSet.add(e.session_year.toString()); });
        } catch(e){}

        const sortedSessions = Array.from(sessionsSet).sort((a, b) => b.localeCompare(a));
        const optionsHtml = sortedSessions.map(s => `<option value="${s}">${s}</option>`).join('');

        formSession.innerHTML = optionsHtml;
        filterSession.innerHTML = `<option value="">সকল সেশন</option>` + optionsHtml;

        const initialVal = defaultConfigSession || currentYear.toString();
        formSession.value = initialVal;
        filterSession.value = initialVal;
    }

    window.generateVoucherId = async function() {
        try {
            const all = await db.expenses.toArray();
            let maxSerial = 10000;
            all.forEach(e => {
                const match = (e.expense_id || '').match(/\d+/);
                if (match) {
                    const num = parseInt(match[0], 10);
                    if (!isNaN(num) && num > maxSerial) maxSerial = num;
                }
            });
            document.getElementById('expense-id').value = "EXP-" + (maxSerial + 1);
        } catch (err) {
            document.getElementById('expense-id').value = "EXP-" + (Date.now().toString().slice(-5));
        }
    };

    window.renderExpensesList = async function() {
        const tableBody = document.getElementById('expense-table-body');
        const mobileContainer = document.getElementById('expense-mobile-cards');
        if (!tableBody || !mobileContainer) return;

        const searchQuery = document.getElementById('search-expense')?.value.toLowerCase().trim() || '';
        const sessionQuery = document.getElementById('filter-expense-session')?.value || '';
        const branchQuery = document.getElementById('filter-expense-branch')?.value || '';
        const categoryQuery = document.getElementById('filter-expense-category')?.value || '';

        try {
            let expenses = await db.expenses.reverse().toArray();
            expenses = expenses.filter(e => e.is_deleted !== 1);

            let fees = await db.fees.toArray();
            fees = fees.filter(f => f.is_deleted !== 1);

            let todayTotal = 0;
            let monthTotal = 0;
            let grandExpenseTotal = 0;
            let totalIncome = 0;

            const todayStr = window.getLocalDateString();
            const currentMonthPrefix = todayStr.substring(0, 7);

            // মোট আয়ের হিসাব
            fees.forEach(f => {
                totalIncome += parseFloat(f.total || f.amount || 0);
            });

            expenses.forEach(e => {
                const amt = parseFloat(e.amount) || 0;
                grandExpenseTotal += amt;
                if (e.date === todayStr) todayTotal += amt;
                if (e.date && e.date.startsWith(currentMonthPrefix)) monthTotal += amt;
            });

            const netCashInHand = totalIncome - grandExpenseTotal;

            document.getElementById('stat-today-expense').textContent = todayTotal.toLocaleString('bn-BD');
            document.getElementById('stat-month-expense').textContent = monthTotal.toLocaleString('bn-BD');
            document.getElementById('stat-total-income').textContent = totalIncome.toLocaleString('bn-BD');
            document.getElementById('stat-net-cash').textContent = netCashInHand.toLocaleString('bn-BD');

            // ফিল্টারিং
            if (sessionQuery) {
                expenses = expenses.filter(e => e.session_year == sessionQuery || !e.session_year);
            }
            if (searchQuery) {
                expenses = expenses.filter(e =>
                    (e.expense_id || '').toLowerCase().includes(searchQuery) ||
                    (e.paid_to || '').toLowerCase().includes(searchQuery) ||
                    (e.category || '').toLowerCase().includes(searchQuery) ||
                    (e.description || '').toLowerCase().includes(searchQuery)
                );
            }
            if (branchQuery) {
                expenses = expenses.filter(e => e.branch === branchQuery);
            }

                expenses = expenses.filter(e => e.category === categoryQuery);

            let html = '';

            expenses.forEach(e => {
                const syncStatusBadge = e.is_synced === 1

                html += `

    // বাংলায় টাকার অংক রূপান্তর হেল্পার
    function amountToBanglaWords(num) {
        if (!num || isNaN(num) || num === 0) return "শূন্য টাকা মাত্র";
        let n = Math.floor(parseFloat(num));
        let words = "";
        const units = ["", "এক", "দুই", "তিন", "চার", "পাঁচ", "ছয়", "সাত", "আট", "নয়", "দশ", "এগার", "বার", "তের", "চৌদ্দ", "পনের", "ষোল", "সতের", "আঠার", "উনিশ"];
        const tens = ["", "", "বিশ", "ত্রিশ", "চল্লিশ", "পঞ্চাশ", "ষাট", "সত্তর", "আশি", "নব্বই"];
        
        function convert2Digit(val) {
            if (val < 20) return units[val];
            let t = Math.floor(val / 10);
            let u = val % 10;
            return tens[t] + (u > 0 ? " " + units[u] : "");
        }
        
        let crore = Math.floor(n / 10000000); n %= 10000000;
        let lakh = Math.floor(n / 100000); n %= 100000;
        let thousand = Math.floor(n / 1000); n %= 1000;
        let hundred = Math.floor(n / 100); n %= 100;
        let remaining = n;
        
        if (crore > 0) words += convert2Digit(crore) + " কোটি ";
        if (lakh > 0) words += convert2Digit(lakh) + " লাখ ";
        if (thousand > 0) words += convert2Digit(thousand) + " হাজার ";
        if (hundred > 0) words += convert2Digit(hundred) + " শত ";
        if (remaining > 0) words += convert2Digit(remaining) + " ";
        
        return words.trim() + " টাকা মাত্র";
    }

    // এক্সেল এক্সপোর্ট ও ইমপোর্ট
    window.exportToExcel = function() {
        if (filteredExpensesArray.length === 0) {
            showToast("কোনো খরচের ডাটা পাওয়া যায়নি!", "error");
            return;
        }
        
        const data = filteredExpensesArray.map(e => ({
            'Voucher ID': e.expense_id,
            'Session Year': e.session_year || '2026',
            'Branch': e.branch,
            'Category': e.category,
            'Paid To': e.paid_to,
            'Amount': e.amount,
            'Method': e.method,
            'Date': e.date,
            'Description': e.description || ''
        }));

        try {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Expenses");
            XLSX.writeFile(wb, `Expense_List_${window.getLocalDateString()}.xlsx`);
            showToast("এক্সেল ফাইল ডাউনলোড শুরু হয়েছে।", "success");
        } catch (err) {
            showToast("এক্সেল ফাইল তৈরি করতে সমস্যা হয়েছে!", "error");
        }
    };

    window.importFromExcel = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

                const curUser = window.currentUser ? window.currentUser.username : "system";
                const importData = jsonData.map((row, i) => ({
                    expense_id: row['Voucher ID'] ? row['Voucher ID'].toString() : 'EXP-' + (Date.now() + i),
                    session_year: (row['Session Year'] || '2026').toString(),
                    branch: (row['Branch'] || 'মূল ক্যাম্পাস').toString(),
                    category: (row['Category'] || 'অন্যান্য').toString(),
                    paid_to: (row['Paid To'] || 'অজানা').toString(),
                    amount: parseFloat(row['Amount']) || 0,
                    method: (row['Method'] || 'ক্যাশ').toString(),
                    date: (row['Date'] || window.getLocalDateString()).toString(),
                    description: (row['Description'] || '').toString(),
                    is_synced: 0,
                    is_deleted: 0,
                    created_by: curUser,
                    updated_by: curUser
                }));

                await db.expenses.bulkPut(importData);
                showToast(`${importData.length}টি খরচের ভাউচার ইমপোর্ট হয়েছে!`, "success");
                if (typeof updatePendingCount === 'function') await updatePendingCount();
                await window.initExpense();
            } catch (err) {
                showToast("ফাইল ইমপোর্টে সমস্যা হয়েছে!", "error");
            }
        };
        reader.readAsArrayBuffer(file);
    };
})();
