<script src="app.js"></script>

<!-- Authentication, Parent Portal & Screen Controller -->
<script>
(function() {
    // ==========================================================
    // ১. অভিভাবক পোর্টাল ইউআরএল চেকার ও হ্যান্ডলার (Parent Portal Interceptor)
    // ==========================================================
function checkParentPortalUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    const parentStudentId = urlParams.get('p') || urlParams.get('student_id');
    
    if (parentStudentId) {
        // ১. অ্যাডমিন লক ওভারলে ও সাইডবার লুকিয়ে ফেলা
        const overlay = document.getElementById('pin-lock-overlay');
        if (overlay) overlay.style.display = 'none';

        const sidebar = document.getElementById('sidebar');
        const header = document.querySelector('header');
        if (sidebar) sidebar.style.display = 'none';
        if (header) header.style.display = 'none';

        // ২. কোনো সেশন থাকবে না (সম্পূর্ণ পাবলিক ও সুরক্ষিত)
        sessionStorage.removeItem('currentUser');
        App.currentUser = null;
        window.currentUser = null;

        // ৩. পোর্টাল লোড
        window.parentPortalStudentId = parentStudentId;
        loadModule('parent_portal');
        return true;
    }
    return false;
}

    // ==========================================================
    // ২. অনলাইন পিন ও টেন্যান্ট ভেরিফিকেশন ইঞ্জিন (Admin Auth)
    // ==========================================================
window.checkPinSubmit = async function() {
    const madrasahIdInput = document.getElementById('lock-madrasah-id');
    const usernameInput = document.getElementById('lock-username');
    const passwordInput = document.getElementById('lock-password');
    if (!madrasahIdInput || !usernameInput || !passwordInput) return;

    const madrasahId = madrasahIdInput.value.trim().toUpperCase();
    const username = usernameInput.value.trim().toLowerCase();
    const pin = window.convertToEnglishDigits(passwordInput.value.trim());

    if (!madrasahId || !username || !pin) {
        showToast("দয়া করে সকল ইনপুট পূরণ করুন!", "error");
        return;
    }

    const lockInputGroup = document.getElementById('lock-input-group');
    const lockStatusArea = document.getElementById('lock-status-area');
    const statusIconBox = document.getElementById('status-icon-box');
    const statusMessage = document.getElementById('status-message');
    const statusSubMessage = document.getElementById('status-sub-message');

    if (lockInputGroup) lockInputGroup.classList.add('hidden');
    if (lockStatusArea) {
        lockStatusArea.classList.remove('hidden');
        statusIconBox.className = "mx-auto w-16 h-16 rounded-full flex items-center justify-center text-3xl bg-white/10 text-yellow-300 animate-spin";
        statusIconBox.innerHTML = `<i class="fa-solid fa-spinner"></i>`;
        statusMessage.textContent = "যাচাই করা হচ্ছে...";
        statusSubMessage.textContent = "সার্ভারের সাথে যোগাযোগ করা হচ্ছে...";
    }

    // মাস্টার শিটে লগইন / ওয়ান-টাইম সেটআপ চেক
 if (navigator.onLine && App.masterUrl) {
        try {
            const payload = JSON.stringify({
                action: 'verify_login_or_setup',
                madrasah_id: madrasahId,
                username: username,
                password: pin
            });

            const res = await fetch(App.masterUrl, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: payload
            });

            const data = await res.json();

            if (data.status !== 'success') {
                handleFailedLogin(data.message || "ভুল ইউজারনেম বা পাসওয়ার্ড!");
                return;
            }

            // তথ্য ক্যাশ করা
            localStorage.setItem('active_madrasah_id', madrasahId);
            localStorage.setItem('active_tenant_script_id', data.script_id);
            if (data.madrasah_name) localStorage.setItem('madrasah_name', data.madrasah_name);

// যদি প্রথমবার হয়, সরাসরি ইনস্টলার উইজার্ডে নিয়ে যাবে
if (data.is_first_time === true) {
    const overlay = document.getElementById('pin-lock-overlay');
    if (overlay) overlay.style.display = 'none';
    resetLockOverlayState();
    
    // ইনস্টলার চালানোর জন্য সাইডবার আপডেট
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.add('hidden', 'md:hidden'); // ইনস্টল চলাকালীন সাইডবার বন্ধ থাকবে
    
    showToast("মাস্টার ভেরিফিকেশন সফল! সেটআপ উইজার্ডে স্বাগতম।", "success");
    loadModule('installer');
    return;
}
            // নিয়মিত লগইন (টেন্যান্ট শিটে ভেরিফিকেশন)
            const tenantUrl = App.getTenantUrl();
            const userPayload = JSON.stringify({
                action: 'verify_user',
                username: username,
                pin: pin
            });

            const userRes = await fetch(tenantUrl, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: userPayload
            });

            const userData = await userRes.json();
            if (userData.status === 'success') {
                const hashedPin = await window.hashPIN(pin);
                await db.users.put({
                    username: username,
                    pin: hashedPin,
                    role: userData.role || 'teacher',
                    fullname: userData.fullname || username,
                    is_synced: 1,
                    is_deleted: 0
                });
                await handleSuccessfulLogin(username, userData.role, userData.fullname || username);
                return;
            } else {
                handleFailedLogin(userData.message || "ভুল পিন কোড!");
                return;
            }

        } catch (err) {
            console.error("লগইন ত্রুটি:", err);
        }
    }

    // অফলাইন ফালব্যাক লগইন
    try {
        const localUser = await db.users.get(username);
        const hashedInputPin = await window.hashPIN(pin);

        if (localUser && localUser.is_deleted !== 1 && (localUser.pin === hashedInputPin || localUser.pin === pin)) {
            await handleSuccessfulLogin(localUser.username, localUser.role, localUser.fullname || localUser.username);
            return;
        } else {
            handleFailedLogin("ভুল ইউজারনেম অথবা পিন কোড!");
        }
    } catch (e) {
        handleFailedLogin("অফলাইন ডাটাবেজে ইউজার পাওয়া যায়নি!");
    }
};

    async function handleSuccessfulLogin(username, role, fullname) {
        const statusIconBox = document.getElementById('status-icon-box');
        const statusMessage = document.getElementById('status-message');
        const statusSubMessage = document.getElementById('status-sub-message');

        if (statusIconBox) {
            statusIconBox.className = "mx-auto w-16 h-16 rounded-full flex items-center justify-center text-4xl bg-emerald-500/20 text-emerald-400 border border-emerald-500 animate-bounce";
            statusIconBox.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
        }
        if (statusMessage) statusMessage.textContent = "স্বাগতম";
        if (statusSubMessage) statusSubMessage.textContent = `${fullname} হিসেবে প্রবেশ করেছেন`;

        const userObj = { username, role, fullname };
        sessionStorage.setItem('currentUser', JSON.stringify(userObj));
        App.currentUser = userObj;
        window.currentUser = userObj;

        // রোল টাইটেল ম্যাপিং
        const userBadge = document.getElementById('user-display-badge');
        if (userBadge) {
            const roleMap = {
                'muhtamim': 'মুহতামিম',
                'nazim': 'নাযিম (শিক্ষা সচিব)',
                'accountant': 'হিসাবরক্ষক',
                'teacher': 'শিক্ষক',
                'librarian': 'গ্রন্থাগারিক',
                'staff': 'স্টাফ'
            };
            const roleTitle = roleMap[role] || (role ? role.toUpperCase() : 'ব্যবহারকারী');

            userBadge.innerHTML = `<i class="fa-solid fa-user-circle"></i> ${fullname} (${roleTitle})`;
            userBadge.classList.remove('hidden');
        }

        setTimeout(() => {
            const overlay = document.getElementById('pin-lock-overlay');
            if (overlay) overlay.style.display = 'none';

            resetLockOverlayState();
            window.updateSidebarNavigation();
            window.checkActiveSession();
        }, 800);
    }

    function handleFailedLogin(errorText) {
        const statusIconBox = document.getElementById('status-icon-box');
        const statusMessage = document.getElementById('status-message');
        const statusSubMessage = document.getElementById('status-sub-message');
        const overlayCard = document.querySelector('#pin-lock-overlay > div');

        if (statusIconBox) {
            statusIconBox.className = "mx-auto w-16 h-16 rounded-full flex items-center justify-center text-4xl bg-red-500/20 text-red-400 border border-red-500";
            statusIconBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i>`;
        }
        if (statusMessage) statusMessage.textContent = "লগইন ব্যর্থ";
        if (statusSubMessage) statusSubMessage.textContent = errorText;

        if (overlayCard) {
            overlayCard.classList.add('animate-shake');
            setTimeout(() => overlayCard.classList.remove('animate-shake'), 400);
        }

        setTimeout(() => resetLockOverlayState(), 1600);
    }

    function resetLockOverlayState() {
        const lockInputGroup = document.getElementById('lock-input-group');
        const lockStatusArea = document.getElementById('lock-status-area');
        const lockHeaderIcon = document.getElementById('lock-header-icon');

        if (lockInputGroup) lockInputGroup.classList.remove('hidden');
        if (lockHeaderIcon) lockHeaderIcon.classList.remove('hidden');
        if (lockStatusArea) lockStatusArea.classList.add('hidden');

        const passwordInput = document.getElementById('lock-password');
        if (passwordInput) passwordInput.value = '';
    }

    window.toggleSidebar = function() {
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        if (!sidebar || !backdrop) return;
        
        if (sidebar.classList.contains('-translate-x-full')) {
            sidebar.classList.remove('-translate-x-full');
            backdrop.classList.remove('hidden');
        } else {
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');
        }
    };

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.warn('Service worker registration failed:', err);
            });
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const activeMadrasah = localStorage.getItem('active_madrasah_id');
        if (activeMadrasah) {
            const mInput = document.getElementById('lock-madrasah-id');
            if (mInput) mInput.value = activeMadrasah;
        }

        // অভিভাবক লিংক চেক: যদি অভিভাবক হন তবে সাধারণ অ্যাডমিন সেটিংস লোড করা বাদ দেবে
        if (!checkParentPortalUrl()) {
            window.applyGlobalSettings();
        }
    });
})();
</script>
</body>
</html>
